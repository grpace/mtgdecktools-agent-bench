[project]
name = "draft-eval"
version = "0.1.0"
description = "Context-aware draft evaluation for the MTG Deck Tools Agent Benchmark (17Lands-derived archetype ratings, expert pick model, run scorer)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draft_eval"]

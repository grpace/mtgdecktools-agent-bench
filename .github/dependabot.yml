# Monthly, grouped, minor and patch only: one PR per ecosystem keeps review load and Actions minutes low.
# Major upgrades (TypeScript, @types/node past the Node 22 runtime, …) are done by hand: they need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  # Base images pinned by digest (Dockerfile; deploy/compose.yaml hub-db). The engine image (phase-server) is upgraded
  # by .github/workflows/deps.yml after a smoke event, never here. CI's Postgres service (ci.yml) is bumped by hand to
  # the hub-db digest.
  # Digest and minor/patch updates only: a major (Node past the 22 runtime, Postgres 18 over a 17 data volume, which it
  # can't open) is a migration, done by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*phase-server*'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

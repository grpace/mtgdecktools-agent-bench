name: Bug report
description: Something in the Director, Hub, bench CLI, scripts or results export doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't paste admin, seat, submission or service tokens, or seat URLs (they contain a token).
        Security problems go to the private channel in docs/SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, set code, seed, number of seats. A scripted-agent reproduction (scripts/mcp-random-agent.mjs) is ideal.
      placeholder: |
        npm run director -- --set fra --agents a,b,c,d,e,f,g,h --seed bug-1
        node scripts/mcp-random-agent.mjs <seat-url>
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (`git describe --always --dirty`), and the engine build from engine/phase.lock.json if you changed it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Director (events, MCP seats), Spectator stream, bench CLI / self-hosting, Hub (submissions, review, export), Results export / site data, Scripts, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the Director log or runs/<event>/events.jsonl. Redact tokens.
      render: text
